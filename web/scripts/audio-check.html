<!doctype html><meta charset="utf-8"><title>audio check</title>
<script type="module">
import { MusicEngine } from '/src/audio/engine.ts';
import { themeFor } from '/src/audio/themes.ts';
const SECONDS = 20, RATE = 44100;
async function render(mode, world, speed, boost) {
  const ctx = new OfflineAudioContext(2, SECONDS * RATE, RATE);
  const e = new MusicEngine(ctx);
  e.setSpeed(speed); e.setBoost(boost); e.snapSpeed();
  e.start(themeFor(mode, world), 0);
  e.pump(SECONDS);
  e.sfx('coin'); e.sfx('star'); e.sfx('powerup');
  const buf = await ctx.startRendering();
  let peak = 0, nan = 0, sq = 0, n = 0;
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < d.length; i++) { const v = d[i]; if (!Number.isFinite(v)) nan++; else { peak = Math.max(peak, Math.abs(v)); sq += v * v; n++; } }
  }
  return { mode, world, speed, peak: +peak.toFixed(3), rms: +Math.sqrt(sq / n).toFixed(4), nan, bpm: e.currentBpm, voices: e.stats.peakVoices, notes: e.stats.scheduled };
}
window.runCheck = async () => [
  await render('menu', 1, 8, false),
  await render('run', 1, 12, false),
  await render('run', 5, 20, false),
  await render('endless', 1, 22, true),
  await render('run', 12, 26, true),
];
</script>
